# Chicago configuration. Paths resolve relative to this file.

[city]
name = "Chicago, Ill."
loc_query = "sanborn maps chicago illinois"
centerlines = "../../fixtures/reference/street_center_lines.geojson"
community_areas = "../../fixtures/reference/community_areas.geojson"
aliases_dir = "aliases"
loc_catalog = "../../fixtures/loc-catalog-chicago.json"
# Chicago's numbered-street grid advances by this many addresses per block.
address_block_size = 100
# Console planning estimate, not an acceptance threshold.
gated_fraction = 0.41
# Rail rescue uses gazetteer-bound labels and rescue clustering, never strict-gate evidence.
# The extract includes rail and transit alignments needed for historic elevated routes.
rail_geojson = "../../fixtures/reference/rail-chicago-cta-overpass.json"
rail_gazetteer = "rail-gazetteer-chicago.json"
renumbering_table = "renumbering-chicago-1909.json"
# This supports operator-era selection; every Chicago volume still declares its address grid.
renumbering_year = 1909
renumbering_note = "Chicago renumbered in 1909; the Loop separately in 1911, and those volumes need the Loop table"
# Primary reads use Codex Terra with its high reasoning effort. Escalation is
# cheap-first within this trial: retry Terra before spending on Sol.
annotation_model = "codex:gpt-5.6-terra"
annotation_variant = "high"
escalation_models = ["codex:gpt-5.6-terra", "codex:gpt-5.6-sol"]
escalation_variants = ["high", "high"]

# Chicago normally corroborates street junctions with the declared address grid.
evidence_channels = ["junction", "addresses"]

# The pinned documented street-rename list the alias proposer reads (`autogeoref
# alias-sweep`). The text is extracted offline from the cached PDF and is NOT
# committed — it is a third-party document; see docs/OPERATIONS.md for the
# one-liner. A city that configures none is scanned and reported, never proposed for.
rename_source_parser = "martin1948"
rename_source_text = "../../cache/renumbering/martin1948.txt"
rename_source_pdf = "../../cache/renumbering/chm_namechanges.pdf"
rename_source_citation = "'Chicago Streets', William Martin 1948 (Chicago History Museum street-name-changes list, http://chsmedia.org/househistory/nameChanges/start.pdf, accessed 2026-07-25)"

# Chicago's house-number grid: numbering runs outward from State & Madison at
# 800 numbers per mile. Read ONLY by the alias proposer's numeral corroboration;
# the placement pipeline never uses it. A city without one gets no numeral check,
# which shrinks the proposer's auto-write tier rather than loosening it.
address_grid_origin = [-87.6278, 41.8819]
address_grid_units_per_mile = 800

# Volumes the alias sweep must never propose for. Each is flagged by the match
# tripwire for a reason that is not a historic-name gap, and the reason is quoted
# in the sweep report so this list cannot rot into folklore.
[city.alias_sweep_skip]
sanborn01790_013 = "1896 suburb index item: 2 street reads over 2 segments, a novelty overlay rather than a funnel"
sanborn01790_016 = "1903 Loop block-line map: 2 segments carrying block lines, not a labelled street vocabulary"
sanborn01790_190 = "1933 Century of Progress fairgrounds: temporary streets that never entered the modern grid"
sanborn01790_014 = "flagged with 34 of 55 zero-candidate pages but undiagnosed; hold until its own diagnosis says whether names are the cause"

# Bounds narrow the Chicago search area: a bbox follows a volume key map,
# bounds_from reuses a counterpart footprint, and bounds_areas joins named community areas.
# addresses_modern selects the current Chicago grid; false uses the configured historic conversion.
#
# This file is also a TEST INPUT: ~20 test modules load it as the config under
# contract. The golden suite bakes _024's scale_m_per_px and rotation_deg into
# its recorded-replay constraints; tests/test_report_config.py pins those
# values and tests/test_escalate.py pins the city escalation ladder — run
# `make test` after editing anything a volume's placement depends on.
[volumes.sanborn01790_024]
# Volume 024 keeps its known scan scale and north-up correction. Its footprint
# was bounds_from = "sanborn01790_093", a volunteer-placed layer retired from the
# viewer manifest; declaring no bounds source lets the run derive its own
# (bounds_bootstrap), which is what every volume does now.
scale_m_per_px = 0.0669
rotation_deg = 1.20
addresses_modern = true

[volumes.sanborn01790_021]
# Volume 021's fixed scale and rotation stabilize this sheet format. Its
# footprint was bounds_from = "sanborn01790_090", retired for the same reason
# as Volume 024's above.
addresses_modern = true
scale_m_per_px = 0.0666
rotation_deg = 0.98

[volumes.sanborn01790_034]
# Volume 034 is the Uptown, Lincoln Square, Edgewater, and Lake View set; its community-area extent and historic grid keep candidates local.
bounds_areas = ["UPTOWN", "LINCOLN SQUARE", "EDGEWATER", "LAKE VIEW"]
scale_m_per_px = 0.0676
rotation_deg = 1.13
addresses_modern = false

[volumes.sanborn01790_038]
# Volume 038 covers Avondale, Irving Park, and North Center, using their combined extent and the current address grid.
bounds_areas = ["AVONDALE", "IRVING PARK", "NORTH CENTER"]
scale_m_per_px = 0.0680
rotation_deg = 0.65
addresses_modern = true

[volumes.sanborn01790_015]
# The Union Stock Yards special is bounded to the yards and rail belt; retain the historic address grid for its industrial sheets.
bounds_bbox = [-87.69, 41.77, -87.61, 41.85]
addresses_modern = false

[volumes.sanborn01790_001]
# Lake View volume: the bbox confines matching to its North Side key-map extent and uses historic addresses.
bounds_bbox = [-87.7035, 41.9101, -87.6243, 41.9696]
addresses_modern = false

[volumes.sanborn01790_017]
# South Division's downtown Loop sheets use a Loop-and-city address conversion and a Loop key-map extent.
bounds_bbox = [-87.6627, 41.8594, -87.6053, 41.9117]
addresses_modern = false
renumbering_table = "renumbering-chicago-loop-merged.json"
page_scale_multiples = { cbd1 = 4.0, cbd2 = 4.0 }
# The Congested District pages use a larger printed scale, so these page-specific multiples recenter scale checks.
# Content masks preserve the mapped block on this sparse one-block sheet format.
content_masks = true
# The Congested District pages are district-scale overviews: hull-clipped masks, a separate archive nothing serves, withheld from the seam solve.
overview_pages = ["cbd1", "cbd2"]

[volumes.sanborn01790_018]
# North and West Division is the companion Loop set, with the same address conversion and enlarged Congested District pages.
bounds_bbox = [-87.6627, 41.8522, -87.6077, 41.9117]
renumbering_table = "renumbering-chicago-loop-merged.json"
addresses_modern = false
page_scale_multiples = { cbd1 = 4.0, cbd2 = 4.0 }
content_masks = true
# These rail-yard pages need full page-rectangle masks because content masking would discard drawn track fields.
content_mask_exempt = ["57", "59", "63"]
overview_pages = ["cbd1", "cbd2"]

[volumes."sanborn01790_006.5"]
# The South Side supplemental half-volume uses the historic Chicago address grid.
addresses_modern = false

[volumes.sanborn01790_040]
# Keep the current Chicago address grid explicit for this volume.
addresses_modern = true

[volumes.sanborn01790_110]
# Keep the current Chicago address grid explicit for this volume.
addresses_modern = true

# Chicago swipe-viewer copy and initial map behavior.
[viewer]
title = "Chicago {era} / Now — Sanborn Atlas"
kicker = "Sanborn Fire Insurance Atlas"
heading = "Chicago {era}"
heading_note = "against now"
dek = "Compare Chicago against what it was decades ago. Look up an address, toggle on different decades, and adjust the slider to see how the city has changed."
loading_text = "unrolling the atlas…"
now_label = "NOW"
# Every era opens together, so the atlas starts at its full extent; each chip
# stays individually toggleable. Where two eras cover the same ground the newer
# sheets draw on top, and turning one off reveals the older ones beneath.
default_eras = ["1890s", "1900s", "1910s", "1920s", "1930s", "1940s", "1950s"]
# Open on the Near West Side. The point selects the volume the viewer opens on —
# the smallest one covering it, here 1950 Vol. 7 — and the Loop volume it used to
# land on is one of the rougher placements to meet first.
home_point = [-87.66207, 41.87007]
footer_source = "Maps: Library of Congress, Sanborn Maps Collection"
# Who georeferenced these layers. One line for the whole site: every layer this
# city serves is placed by this pipeline. `serving_dirs` below is what keeps
# that true — an undeclared directory is refused rather than credited to us.
# HTML, and the link is the honest form of the claim: the walkthrough is where a
# reader checks the method. Relative, because the two roots differ — the local
# server puts the page under /viewer/ and the deploy bundle IS the web root.
optional_credits = 'auto-georeferenced by <a href="walkthrough.html">this pipeline</a>'

# deploy/tiles/ subdirectories this city vouches for. A manifest build refuses
# any other one rather than publish it under the credit above. Declared here
# rather than left to the default so the guarantee is visible where the credit is.
serving_dirs = ["autogeoref"]

[viewer.geocoder]
# Limit address searches to greater Chicago and append the city for unqualified queries.
suffix = ", Chicago, IL"
bbox = [-87.95, 41.62, -87.5, 42.05] # west, south, east, north

[viewer.basemap]
# A self-hosted Protomaps extract, not OSMF's raster tiles: a public swipe
# viewer pulls a few hundred basemap tiles per pane per session, which their
# tile policy forbids (HANDOFF-VIEWER-DEPLOY-2026-07-24.md §1-2). The archive
# name carries the planet build date; docs/OPERATIONS.md owns the rule about
# publishing a refresh under a new name.
type = "vector"
pmtiles = "../deploy/tiles/basemap/basemap-chicago-20260723.pmtiles"
# One flavor per pane: muted grey under the atlas sheets, light for today.
style_atlas = "vendor/basemap/style-grayscale.json"
style_now = "vendor/basemap/style-light.json"
attribution = '© OpenStreetMap contributors, <a href="https://protomaps.com" target="_blank">Protomaps</a>'

# Group map years into decade labels shown by the viewer.
[[viewer.era]]
years = [1890, 1899]
label = "1890s"

[[viewer.era]]
years = [1900, 1909]
label = "1900s"

[[viewer.era]]
years = [1910, 1919]
label = "1910s"

[[viewer.era]]
years = [1920, 1929]
label = "1920s"

[[viewer.era]]
years = [1930, 1939]
label = "1930s"

[[viewer.era]]
years = [1940, 1949]
label = "1940s"

[[viewer.era]]
years = [1950, 1959]
label = "1950s"

# Outside a community-area match, derive a Chicago side label from these latitude and longitude bands.
[viewer.region_labels]
combine = "{lat} {lng}"
collapse = [["Central Side", "Central"]]
lat = [
    { above = 41.94, label = "Far North" },
    { above = 41.885, label = "North" },
    { above = 41.84, label = "Central" },
    { above = 41.76, label = "South" },
    { label = "Far South" },
]
lng = [
    { below = -87.72, label = "West Side" },
    { above = -87.63, label = "Lakefront" },
    { label = "Side" },
]

# District names shown in the atlas panel, overriding the catalogue subject.
# These three volumes are placed or corrected in the review UI rather than by
# the gates, and every one of their sheets is, so the name says so. A volume
# whose sheets are mostly automated must not be labelled this way.
[viewer.labels]
"sanborn01790_188" = "Central Business District (placement adjusted by hand)"
"sanborn01790_189" = "North Central Business District (placement adjusted by hand)"
"sanborn01790_190" = "A Century of Progress International Exposition (placed manually in review)"


# Key map hedges its west boundary as about Stewart; every other edge is a hard feature (89th,
# 115th, Lake Calumet). The west edge was -87.642 and excluded the 800-1200 W streets the sheets
# name. Bounds is a search area, not a gate: do not re-tighten this edge to Stewart.
bounds_bbox = [-87.652, 41.679, -87.575, 41.741]
addresses_modern = true

[volumes."sanborn01790_060"]

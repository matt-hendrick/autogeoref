<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How a scanned atlas becomes a map</title>
<!-- This page is about the pipeline and not about a city, so its title and
     description are project facts and belong here rather than in a manifest.
     The deploy mirrors both into the share-card tags at the marker below and
     adds the two that need the site's own URL. The script rewrites the title
     as a reader steps through the panels; this is what a crawler reads. -->
<meta name="description" content="An illustrated walkthrough of how a scanned fire-insurance atlas is turned into a georeferenced map, one stage at a time, with every figure rendered from a real run.">
<!--SOCIAL-->
<!-- Markup only: the styling is walkthrough.css, the behaviour is
     walkthrough.js, and everything either of them says comes from
     walkthrough/panels.json, which is generated by
     scripts/walkthrough/make_walkthrough_assets.py from a real run.

     No pipeline logic here or in the script: every number, threshold and
     rendered state is produced in Python and shipped as an asset, so a
     figure on this page cannot drift away from the code it describes.
     tests/test_walkthrough_page.py greps these files to keep it that way. -->
<!-- Icons, same set and same order as index.html; the reason for both is
     documented there. -->
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="mask-icon" href="safari-pinned-tab.svg" color="#14161B">
<meta name="theme-color" content="#14161B">
<link rel="stylesheet" href="vendor/fonts/fonts.css">
<link rel="stylesheet" href="walkthrough.css">
</head>
<body>

<a class="skip" href="#panel">Skip to the walkthrough</a>

<header id="masthead">
  <div class="kicker" id="kicker">an illustrated walkthrough</div>
  <h1>How a scanned atlas becomes a map</h1>
  <p class="dek" id="dek"></p>
</header>

<nav id="progress" aria-label="Steps">
  <ol id="steps"></ol>
</nav>

<main id="panel" tabindex="-1">
  <div id="stage">
    <figure id="figure">
      <!-- a plain link to the file: on a phone the figure is smaller than its
           lettering needs, and opening the image itself is the one way to zoom
           into it that works in every browser without a script -->
      <a id="plate-link" href="" target="_blank" rel="noopener">
        <img id="plate" alt="">
      </a>
      <figcaption id="plate-note"></figcaption>
    </figure>
    <div id="states" role="group" aria-label="Compare states"></div>
  </div>

  <div id="reading">
    <div class="act" id="act"></div>
    <h2 id="title"></h2>
    <p class="lede" id="lede"></p>
    <p class="body" id="caption"></p>
    <p class="order-note" id="order-note" hidden></p>
    <dl id="figures"></dl>
    <div id="tally">
      <div class="tally-head">Where the volume stands at this point</div>
      <div id="tally-bar"><span class="seg placed"></span><span class="seg prov"></span><span class="seg flagged"></span></div>
      <div id="tally-note"></div>
    </div>
  </div>
</main>

<nav id="controls" aria-label="Walkthrough navigation">
  <button id="prev" type="button">&lsaquo; Back</button>
  <span id="counter" aria-live="polite"></span>
  <button id="next" type="button">Next &rsaquo;</button>
</nav>

<footer id="footer">
  <div id="glossary"></div>
  <p id="credits"></p>
  <p id="outro">
    Every figure on this page was rendered from a real run of the pipeline.
    <a href="index.html">Browse the finished maps &rsaquo;</a>
    <a href="https://github.com/matt-hendrick/autogeoref" target="_blank" rel="noopener"
       aria-label="Read the source, opens in a new tab"
       >Read the source<span aria-hidden="true"> &#8599;</span></a>
  </p>
</footer>

<script src="walkthrough.js"></script>
</body>
</html>
